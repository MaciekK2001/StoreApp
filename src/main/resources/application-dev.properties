# Profil deweloperski (dev)
# Konfiguracja lokalnej bazy danych PostgreSQL
# Mozesz nadpisac te wartosci przez zmienne srodowiskowe DEV_DB_URL, DEV_DB_USERNAME, DEV_DB_PASSWORD
# lub podajac standardowa zmienna DATABASE_URL (np. postgresql://postgres:postgres@localhost:5432/mebledb)
spring.datasource.url=${DEV_DB_URL:jdbc:postgresql://localhost:5432/firma_db}
spring.datasource.username=${DEV_DB_USERNAME:postgres}
spring.datasource.password=${DEV_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.produkcja.meble.app=DEBUG

# Domyslny klucz JWT dla profilu dev (min. 32 bajty dla HS256)
app.jwt.secret=${JWT_SECRET:c3VwZXItc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9uLXByb2R1a3Rpb24tZGV2}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}
