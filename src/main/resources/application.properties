server.port=${PORT:8080}
spring.application.name=app

# Database Configuration (Render / Production uses DATABASE_URL)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false

# JWT Configuration (Key must be at least 256-bit for HS256)
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-millis=${JWT_EXPIRATION_MILLIS:86400000}

# Multipart Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${APP_UPLOAD_DIR:uploads/products}

# users
app.init.admin1.username=${APP_ADMIN1_USERNAME:}
app.init.admin1.email=${APP_ADMIN1_EMAIL:}
app.init.admin1.password=${APP_ADMIN1_PASSWORD:}

app.init.admin2.username=${APP_ADMIN2_USERNAME:}
app.init.admin2.email=${APP_ADMIN2_EMAIL:}
app.init.admin2.password=${APP_ADMIN2_PASSWORD:}
